name: Secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified scanner
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --output /tmp/gitleaks-checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          python3 - <<'PYVERIFY'
          import hashlib, pathlib, tarfile
          archive = pathlib.Path('/tmp/gitleaks.tar.gz')
          expected = next(line.split()[0] for line in pathlib.Path('/tmp/gitleaks-checksums.txt').read_text().splitlines() if line.endswith('gitleaks_8.30.1_linux_x64.tar.gz'))
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Scanner checksum mismatch'
          with tarfile.open(archive) as bundle:
              bundle.extract('gitleaks', path='/tmp', filter='data')
          PYVERIFY
      - name: Scan current files and commit history
        run: |
          /tmp/gitleaks dir . --redact --no-banner
          /tmp/gitleaks git --log-opts=--all --redact --no-banner
